<style>
  :root {

  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);

  .shell-nav {

    padding: 0 12px; overflow-x: auto; flex-shrink: 0;
  }
  .shell-title {
    font-weight: 700; font-size: 0.85rem; letter-spacing: 0.02em;
    color: var(--ink); padding: 12px 12px 12px 0; white-space: nowrap;
    border-right: 1px solid var(--rule); margin-right: 8px;
  }
  .shell-tab {
    appearance: none; border: none; background: transparent; cursor: pointer;
    padding: 14px 14px; font-size: 0.82rem; font-weight: 600;
    color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .shell-tab:hover { color: var(--ink); }
  .shell-tab.active { color: var(--accent); border-bottom-color: var(--accent-2); }
  .shell-frames { position: relative; flex: 1; min-height: 0; }
  .shell-frames iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: var(--paper); display: none;
  }
  .shell-frames iframe.active { display: block; }
  .shell-loading {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 0.85rem;
  }
</style>

<script>
(function () {
  var data = JSON.parse(document.getElementById('docs-b64').textContent);

  function b64ToUtf8(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  var frames = {
    'frame-proposal': data.proposal,
    'frame-team': data.team,
    'frame-mapping': data.mapping
  };

  Object.keys(frames).forEach(function (id) {
    var el = document.getElementById(id);
    el.srcdoc = b64ToUtf8(frames[id]);
  });

  var loading = document.getElementById('shell-loading');
  var firstFrame = document.getElementById('frame-proposal');
  firstFrame.addEventListener('load', function () {
    if (loading) loading.style.display = 'none';
  });

  var tabs = document.querySelectorAll('.shell-tab');
  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabs.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.shell-frames iframe').forEach(function (f) {
        f.classList.remove('active');
      });
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
})();
</script>
